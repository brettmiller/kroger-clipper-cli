[project]
name = "kroger-clipper-cli"
version = "0.1.0"
description = "Clip Kroger digital coupons from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "curl-cffi>=0.16.3",
    "playwright>=1.49",
]

[project.scripts]
kroger-clipper = "kroger_clipper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kroger_clipper"]

[tool.ruff]
line-length = 100
